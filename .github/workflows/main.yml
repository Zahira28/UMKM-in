name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify repository structure
        run: |
          test -f README.md
          test -f docs/index.md
          test -f docs/_config.yml

      - name: Lint markdown documentation
        run: |
          npx --yes markdownlint-cli "docs/**/*.md" "README.md" --ignore node_modules || true
