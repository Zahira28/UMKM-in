name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  docs-check:
    name: Docs Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify repository structure
        run: |
          test -f README.md
          test -f docs/index.md
          test -f docs/_config.yml

      - name: Lint markdown documentation
        run: |
          npx --yes markdownlint-cli "docs/**/*.md" "README.md" --ignore node_modules || true

  frontend-ci:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Build Next.js production app
        run: npm run build

  backend-ci:
    name: Backend Build & Vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
          cache: true
          cache-dependency-path: 'backend/go.sum'

      - name: Verify Go modules
        run: go mod verify

      - name: Run Go vet code analysis
        run: go vet ./...

      - name: Build backend application
        run: go build -v ./...

      - name: Run Go tests
        run: go test -v ./...
